[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encoding-claim-audit"
version = "0.1.0"
description = "Offline audit of documented text encoding claims against Python source"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "encoding-claim-audit contributors"}]
dependencies = []

[project.scripts]
encoding-claim-audit = "encoding_claim_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
